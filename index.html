<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racha dos Teimosos</title>
<style>
:root{--bg:#f6f2ee;--card:#ffffff;--ink:#231a14;--muted:#73665c;--line:#ece3db;--accent:#d9661a;--head1:#f08a2c;--head2:#c4520f;--soft:#fdeee2;--s1:#d9661a;--s2:#1f72b8;--gold:#d9a21b;--silver:#9aa3ad;--bronze:#b8733a;--shadow:0 1px 2px rgba(60,30,10,.06),0 4px 14px rgba(60,30,10,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15100d;--card:#201813;--ink:#f3ebe5;--muted:#ab9d93;--line:#33271f;--accent:#ff9440;--head1:#d06a1c;--head2:#8f3f0b;--soft:#33231a;--s1:#d4702a;--s2:#4a9be0;--shadow:none}}
:root[data-theme="dark"]{--bg:#15100d;--card:#201813;--ink:#f3ebe5;--muted:#ab9d93;--line:#33271f;--accent:#ff9440;--head1:#d06a1c;--head2:#8f3f0b;--soft:#33231a;--s1:#d4702a;--s2:#4a9be0;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:18px 16px 14px}
.hd{display:flex;gap:14px;align-items:center;max-width:1000px;margin:0 auto}
.logo{background:#fff;border-radius:14px;padding:4px;height:64px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header h1{margin:0;font-size:23px;letter-spacing:.3px}
header p{margin:2px 0 0;opacity:.9;font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
nav div{display:flex;gap:4px;overflow-x:auto;max-width:1000px;margin:0 auto;padding:8px 12px;scrollbar-width:none}
nav button{flex:none;border:0;background:transparent;color:var(--muted);padding:8px 14px;font:600 14px system-ui;border-radius:999px;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
h2{font-size:17px;margin:26px 0 4px;display:flex;align-items:center;gap:8px}
h2+.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.c small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.c b{display:block;font-size:18px;margin-top:2px}
.c .v{color:var(--accent);font-weight:700}
.c .x{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.aw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.aw .top{display:flex;gap:12px;align-items:center}
.ico{position:relative;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.ico svg{width:30px;height:30px}
.ico i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:15px;background:var(--card);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.aw small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.aw b{display:block;font-size:19px;line-height:1.2}
.aw .v{color:var(--accent);font-weight:700;font-size:14px}
.odds{margin-top:12px;display:grid;gap:6px}
.od{display:grid;grid-template-columns:100px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.od span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od .tr{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.od .tr i{display:block;height:100%;background:var(--s1);border-radius:999px}
.od em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.gap{font-size:12px;color:var(--muted);margin-top:8px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}
.pd{text-align:center}
.pd b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .v{color:var(--accent);font-weight:700;font-size:13px}
.pd .blk{margin-top:6px;border-radius:12px 12px 4px 4px;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;cursor:pointer;user-select:none;background:var(--card)}
th:nth-child(2),td:nth-child(2){text-align:left}
th+th,td+td{border-left:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
td.pts{font-weight:700;color:var(--accent)}
.pos{color:var(--muted);width:30px}
.md{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:12px}
a.pl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.pb{display:flex;align-items:center;gap:8px;min-width:110px}
.pb i{display:block;height:8px;border-radius:999px;background:var(--s1);opacity:.85}
.pb b{font-weight:700;color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.tag{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 10px;margin:3px 3px 0 0;font-size:12px;font-weight:600}
.hide{display:none}
.cbar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:14px}.cbar select{min-width:0;width:100%}.cbar #cP{grid-column:1/-1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;border-radius:18px;padding:16px;text-align:center}
.vs h3{margin:0;font-size:22px;word-break:break-word}.vs p{margin:2px 0 0;font-size:12px;opacity:.9}
.vs .x{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--head2);display:grid;place-items:center;font-weight:900}
.vs .sc{font-size:30px;font-weight:900;margin-top:4px}
.duel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:var(--shadow)}
.dl{padding:9px 0;border-bottom:1px solid var(--line)}.dl:last-child{border-bottom:0}
.dl .lb{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dl .row{display:grid;grid-template-columns:70px 1fr 1fr 70px;gap:6px;align-items:center;margin-top:4px;font-variant-numeric:tabular-nums}
.dl .row b{font-size:15px}.dl .row b.w{color:var(--ink)}.dl .row b.l{color:var(--muted);font-weight:500}
.dl .row b:first-child{text-align:left}.dl .row b:last-child{text-align:right}
.dl .l1,.dl .l2{height:10px;background:var(--soft);border-radius:999px;display:flex}
.dl .l1{justify-content:flex-end}.dl .l1 i{background:var(--s1);border-radius:999px}.dl .l2 i{background:var(--s2);border-radius:999px}
.dl .l1 i,.dl .l2 i{display:block;height:100%}
.dl .row b.w::after{content:" ✓";color:var(--accent);font-size:12px}
.dl .row b:first-child.w::after{content:""}.dl .row b:first-child.w::before{content:"✓ ";color:var(--accent);font-size:12px}
:root{--win:#3e9b5f;--draw:#b3a79d;--loss:#c9503f;--zebra:#fbf8f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--zebra:#251c16;--draw:#6e635b}}
:root[data-theme="dark"]{--zebra:#251c16;--draw:#6e635b}
table.rkg td{background:var(--card)}
table.rkg tbody tr:nth-child(even) td{background:var(--zebra)}
table.rkg tbody tr:nth-child(-n+3) td{font-weight:600}
table.rkg th:nth-child(1),table.rkg td:nth-child(1){position:sticky;left:0;z-index:1;min-width:38px}
table.rkg th:nth-child(2),table.rkg td:nth-child(2){position:sticky;left:38px;z-index:1;box-shadow:inset -1px 0 0 var(--line)}
table.rkg tr.grp th{position:static;box-shadow:none;font-size:10.5px;letter-spacing:.6px;color:var(--accent);border-bottom:0;padding:8px 10px 0;cursor:default}
table.rkg tr.grp th+th{border-left:1px solid var(--line)}
.mini{display:inline-block;width:34px;height:6px;border-radius:999px;background:var(--soft);margin-right:6px;vertical-align:middle;overflow:hidden}.mini i{display:block;height:100%;background:var(--s1)}
.ved{display:inline-flex;gap:2px;width:54px;height:8px;margin-right:6px;vertical-align:middle;border-radius:999px;overflow:hidden}.ved i{display:block;height:100%}
.cv{color:var(--win);font-weight:700}.cd{color:var(--loss);font-weight:700}
.vu{color:var(--win);font-weight:700;font-size:12px}.vd{color:var(--loss);font-weight:700;font-size:12px}.v0{color:var(--muted)}.vn{color:var(--accent);font-size:11px;font-weight:700}
.ht{display:inline-block;min-width:48px;padding:3px 8px;border-radius:999px;font-weight:600;background:color-mix(in srgb,var(--s1) calc(var(--h)*55%),transparent);color:var(--ink)}
.fame{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.fm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.fm.f0{border-color:var(--gold);background:linear-gradient(135deg,#d9a21b18,var(--card))}
.fm.f1{border-color:var(--silver)}.fm.f2{border-color:var(--bronze)}
.fr{display:flex;align-items:center;gap:10px}.fr>div{flex:1;min-width:0}
.fr b{display:block;font-size:17px}.fr small{color:var(--muted);font-size:12px}
.fr em{font-style:normal;font-size:26px;font-weight:800;color:var(--accent)}
.rk{color:var(--muted);width:24px;text-align:center}
.tts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tt{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px 3px 6px;font-size:13px}
.tt svg{width:16px;height:16px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.yr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.yr.open{border:2px dashed var(--accent)}
.yh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.yh b{font-size:24px;color:var(--accent)}.yh span{color:var(--muted);font-size:12px}
.yl{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.yl .ico{width:36px;height:36px}.yl .ico svg{width:20px;height:20px}.yl .ico i{width:18px;height:18px;font-size:11px;right:-5px;bottom:-5px}
.yl small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}.yl b{font-size:15px}
.hero{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.hero h3{margin:0;font-size:26px}
.hero p{margin:2px 0 10px;opacity:.9;font-size:13px}
.hero .tag{background:rgba(255,255,255,.18);color:#fff}
.hero .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hero .nums div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px;text-align:center}
.hero .nums b{display:block;font-size:20px}.hero .nums small{font-size:11px;opacity:.9;text-transform:uppercase}
.prof{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.pr{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.pr .tr{position:relative;height:12px;background:var(--soft);border-radius:999px}
.pr .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:999px}
.pr .tr u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.6}
.pr em{font-style:normal;font-weight:700;text-align:right}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:4px;border-radius:2px;display:inline-block}
.form{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.form span{min-width:34px;padding:4px 6px;border-radius:8px;text-align:center;font-weight:700;font-size:13px;color:#fff}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;z-index:9;display:none;white-space:nowrap}
.fila{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;box-shadow:var(--shadow)}
.fi em{position:absolute;right:10px;top:8px;font-style:normal;color:var(--muted);font-size:12px}
.fi b{display:block}.fi small{color:var(--muted);font-size:12px}
.fi.prox{border-color:var(--accent);background:var(--soft)}
.yy{color:var(--muted);font-size:11px}
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px;columns:2;column-gap:20px}
.hist h3{column-span:all;margin:6px 0;font-size:14px;color:var(--accent)}
.hist div{padding:3px 0;break-inside:avoid}.hist span{display:inline-block;width:52px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fd=d=>d.split('-').reverse().join('/');
const pct=x=>isFinite(x)?(x*100).toFixed(0)+'%':'—';
const n1=x=>isFinite(x)?x.toFixed(2).replace('.',','):'—';
const n0=x=>isFinite(x)?Math.round(x).toLocaleString('pt-BR'):'—';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function agg(rows,gk=false){
  const m={};const ys=new Set(rows.map(r=>r.y)),y1=ys.size===1?[...ys][0]:null;
  for(const r of rows){
    const s=m[r.j]??={j:r.j,rachas:new Set(),V:0,E:0,D:0,G:0,A:0,B:0,GS:0,JG:0,gkR:0,JE:0,VE:0,GE:0,AE:0};
    if(anosED.has(r.y)){s.JE+=r.v+r.e+r.dr;s.VE+=r.v;s.GE+=r.g;s.AE+=r.a}
    s.rachas.add(r.d);s.V+=r.v;s.E+=r.e;s.D+=r.dr;s.G+=r.g;s.A+=r.a;s.B+=bonus(r);
    if(r.p==='GOLEIRO'){s.GS+=r.gs;s.JG+=r.v+r.e+r.dr;s.gkR++}
  }
  // médias por jogo e % de vitórias só com anos que têm empates/derrotas (antes disso jogos = vitórias)
  return Object.values(m).map(s=>{s.R=s.rachas.size;s.J=s.V+s.E+s.D;s.pv=s.JE?s.VE/s.JE:NaN;
    s.dv=y1&&!anosED.has(y1)&&!CONS.has(y1)?JOGOS_POR_RACHA*s.R:divPV(s.j,s.J,y1,gk);s.pts=3*s.V+s.E+s.G+s.A+(s.J?100*s.V/s.dv:0)+s.B;s.dia=3*s.V+s.E+s.G+s.A;
    s.gj=s.JE?s.GE/s.JE:NaN;s.aj=s.JE?s.AE/s.JE:NaN;s.ga=s.JE?(s.GE+s.AE)/s.JE:NaN;return s});
}
const topo=(L,k)=>[...L].sort((a,b)=>b[k]-a[k])[0];
const ordem=(L,k)=>[...L].sort((a,b)=>b[k]-a[k]);
// média por jogo como pílula com fundo mais forte quanto maior o valor (só quem tem 4+ jogos define o máximo)
const heat=(L,k)=>{const max=Math.max(...L.filter(s=>s.J>=4).map(s=>s[k]).filter(isFinite))||1;
  return v=>isFinite(v)?`<span class="ht" style="--h:${Math.min(1,v/max).toFixed(2)}">${n1(v)}</span>`:'—'};
const medal=i=>i<3?`<span class="md" style="background:${['var(--gold)','var(--silver)','var(--bronze)'][i]}">${i+1}</span>`:i+1;

function tabela(cols,L,sortKey,opts={}){
  const id='t'+Math.random().toString(36).slice(2);
  const render=(k,dir)=>{
    const S=[...L].sort((a,b)=>dir*((b[k]??-1e9)-(a[k]??-1e9))||String(a.j).localeCompare(String(b.j)));
    return `<table class="${opts.cls||''}"><thead>${opts.groups?`<tr class="grp">${opts.groups.map(([t,n])=>`<th colspan="${n}">${t}</th>`).join('')}</tr>`:''}<tr><th class="pos">#</th>${cols.map(c=>`<th data-k="${c[1]}">${c[0]}</th>`).join('')}</tr></thead><tbody>`+
      S.map((s,i)=>`<tr><td class="pos">${opts.medals&&k===sortKey&&dir===1?medal(i):i+1}</td>${cols.map(c=>`<td class="${c[3]||''}">${c[1]==='j'&&!opts.plain?`<a class="pl" data-j="${s.j}">${s.j}</a>`:c[2]?c[2](s[c[1]],s):s[c[1]]}</td>`).join('')}</tr>`).join('')+'</tbody></table>';
  };
  setTimeout(()=>{const el=document.getElementById(id);if(!el)return;let dir=1,k=sortKey;
    el.addEventListener('click',ev=>{const th=ev.target.closest('th[data-k]');if(!th||th.dataset.k==='j')return;
      dir=th.dataset.k===k?-dir:1;k=th.dataset.k;el.innerHTML=render(k,dir)})});
  return `<div class="tw" id="${id}">${render(sortKey,1)}</div>`;
}

const PREMIOS=[
  {id:'mj',nome:'Melhor jogador',k:'pts',suf:'pts',cor:'#d9a21b',emo:'👑',f:n0},
  {id:'art',nome:'Artilheiro',k:'G',suf:'gols',cor:'#e8731a',emo:'⚽',f:n0},

/* ---------- simulação das chances ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function chances(y,N=4000){
  if(+y!==anos[0]||RESTANTES<=0)return null;
  const rows=R.filter(r=>r.y===+y),nR=new Set(rows.map(r=>r.d)).size;
  const L=agg(rows),GK=agg(rows.filter(r=>r.p==='GOLEIRO'),true);
  const hist={};rows.forEach(r=>(hist[r.j]??=[]).push(r));
  const rand=rng(20261010);
  const win={};PREMIOS.forEach(p=>win[p.id]={});
  const pts=(o,j,gk)=>{const J=o.V+o.E+o.D;return 3*o.V+o.E+o.G+o.A+(J?100*o.V/divPV(j,J,+y,gk):0)+o.B};
  for(let n=0;n<N;n++){
    const sim={},simG={};
    for(const s of L){const o={V:s.V,E:s.E,D:s.D,G:s.G,A:s.A,B:s.B};
      const gk=GK.find(x=>x.j===s.j),og=gk?{V:gk.V,E:gk.E,D:gk.D,G:gk.G,A:gk.A,B:gk.B}:null;
      const h=hist[s.j],pres=s.R/nR;
      for(let k=0;k<RESTANTES;k++){if(rand()>=pres)continue;const r=h[Math.floor(rand()*h.length)];
        o.V+=r.v;o.E+=r.e;o.D+=r.dr;o.G+=r.g;o.A+=r.a;o.B+=bonus(r);
        if(og&&r.p==='GOLEIRO'){og.V+=r.v;og.E+=r.e;og.D+=r.dr;og.G+=r.g;og.A+=r.a;og.B+=bonus(r)}}
      sim[s.j]={pts:pts(o,s.j),G:o.G,A:o.A,V:o.V};if(og)simG[s.j]={pts:pts(og,s.j,true)};}
    for(const p of PREMIOS){const S=p.gk?simG:sim;let best=-1,who=[];
      for(const j in S){const v=S[j][p.k];if(v>best+1e-9){best=v;who=[j]}else if(Math.abs(v-best)<1e-9)who.push(j)}
      who.forEach(j=>win[p.id][j]=(win[p.id][j]||0)+1/who.length)}
  }
  const out={};for(const p of PREMIOS)out[p.id]=Object.entries(win[p.id]).map(([j,c])=>({j,c:c/N})).sort((a,b)=>b.c-a.c);
  return out;
}

/* ---------- gráficos SVG ---------- */
const tip=document.getElementById('tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.max(8,Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(e.clientY-36)+'px'});
function linhas(series,labels,yfmt=n0){
  const W=380,H=220,pl=34,pr=74,pt=10,pb=24;const max=Math.max(...series.flatMap(s=>s.vals))*1.05||1;
  const x=i=>pl+(labels.length<2?0:i*(W-pl-pr)/(labels.length-1)),y=v=>pt+(H-pt-pb)*(1-v/max);
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(max*f)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${yfmt(max*f)}</text>`).join('');
  const step=Math.ceil(labels.length/4);
  const xl=labels.map((l,i)=>i%step===0||i===labels.length-1?`<text x="${x(i)}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${l}</text>`:'').join('');
  const ends=series.map(s=>y(s.vals[s.vals.length-1]));if(ends.length===2&&Math.abs(ends[0]-ends[1])<14){const m=(ends[0]+ends[1])/2,sg=ends[0]<ends[1]?-1:1;ends[0]=m+sg*7;ends[1]=m-sg*7}
  const ln=series.map((s,k)=>`<path d="${s.vals.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('')}" fill="none" stroke="${s.cor}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''}/>`+
    `<circle cx="${x(s.vals.length-1)}" cy="${y(s.vals[s.vals.length-1])}" r="4" fill="${s.cor}" stroke="var(--card)" stroke-width="2"/>`+
    `<text x="${x(s.vals.length-1)+8}" y="${ends[k]+4}" font-size="12" fill="var(--ink)">${s.nome.split(' ')[0]} ${yfmt(s.vals[s.vals.length-1])}</text>`).join('');
  const cw=(W-pl-pr)/Math.max(1,labels.length-1);
  const hit=labels.map((l,i)=>`<rect x="${x(i)-cw/2}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent" data-tip="${l}: ${series.map(s=>s.nome+' '+yfmt(s.vals[i])).join(' · ')}"/>`).join('');
  return `<div class="lg">${series.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}">${grid}${xl}${ln}${hit}</svg>`;
}
function barras(cats,series,yfmt=n1){
  const W=380,H=190,pl=34,pt=12,pb=24,gw=(W-pl)/cats.length,bw=Math.min(34,(gw-16)/series.length-2);
  const max=Math.max(...series.flatMap(s=>s.vals.filter(isFinite)))*1.1||1,y=v=>pt+(H-pt-pb)*(1-v/max);
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(max*f)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${yfmt(max*f)}</text>`).join('');
  let b='';cats.forEach((c,i)=>{const x0=pl+i*gw+(gw-series.length*(bw+2))/2;
    series.forEach((s,k)=>{const v=s.vals[i];if(!isFinite(v)||v<=0)return;const x=x0+k*(bw+2),yy=y(v),h=H-pb-yy,r=Math.min(4,h);
      b+=`<path d="M${x} ${H-pb}V${yy+r}Q${x} ${yy} ${x+r} ${yy}H${x+bw-r}Q${x+bw} ${yy} ${x+bw} ${yy+r}V${H-pb}Z" fill="${s.cor}" data-tip="${c} · ${s.nome}: ${yfmt(v)}"/>`});
    b+=`<text x="${pl+i*gw+gw/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${c}</text>`});
  return `<div class="lg">${series.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}">${grid}${b}</svg>`;
}

/* ---------- Temporada ---------- */
function ano(y){
  y=+y;const rows=R.filter(r=>r.y===y),L=agg(rows),nR=new Set(rows.map(r=>r.d)).size;
  if(CONS.has(y)){anoCons(y,L);return}
  L.forEach(s=>s.pres=s.R/nR);
  const GK=agg(rows.filter(r=>r.p==='GOLEIRO'),true);GK.forEach(s=>s.mgs=s.GS/s.JG);
  const semED=!anosED.has(y);
  const ch=chances(y);
  const maxP=topo(L,'pts').pts;
  // variação de posição em relação à rodada anterior
  const dY=[...new Set(rows.map(r=>r.d))].sort(),prevD=dY[dY.length-2];
  let varF=()=>'';
  if(prevD){const pr=ordem(agg(rows.filter(r=>r.d<=prevD)),'pts').map(s=>s.j),cur=ordem(L,'pts').map(s=>s.j);
    L.forEach(s=>{const a=pr.indexOf(s.j);s.vr=a<0?999:a-cur.indexOf(s.j)});
    varF=v=>v===999?'<span class="vn">novo</span>':v>0?`<span class="vu">▲${v}</span>`:v<0?`<span class="vd">▼${-v}</span>`:'<span class="v0">–</span>'}
  const fc=c=>c>=.995?'>99%':c<.01?'<1%':Math.round(c*100)+'%';
  const aw=PREMIOS.map(p=>{const S=ordem(p.gk?GK:L,p.k),l=S[0],s2=S[1];if(!l)return'';
    const od=ch?ch[p.id].filter(o=>o.c>=0.005).slice(0,4):null;
    return `<div class="aw"><div class="top">${icone(p)}<div><small>${p.nome}</small><b>${l.j}</b><span class="v">${p.f(l[p.k])} ${p.suf}</span></div></div>
    ${od?`<div class="odds">${od.map(o=>`<div class="od" data-tip="${o.j}: ${fc(o.c)} de chance"><span>${o.j}</span><div class="tr"><i style="width:${o.c*100}%"></i></div><em>${fc(o.c)}</em></div>`).join('')}</div>`:''}
    ${s2?`<div class="gap">2º ${s2.j}, ${p.f(l[p.k]-s2[p.k])} ${p.suf} atrás</div>`:''}</div>`}).join('');
  const t3=ordem(L,'pts').slice(0,3),pod=[1,0,2].map(i=>t3[i]?`<div class="pd"><b>${t3[i].j}</b><span class="v">${n0(t3[i].pts)} pts</span><div class="blk" style="height:${[92,70,56][i]}px;background:${['var(--gold)','var(--silver)','var(--bronze)'][i]}">${i+1}º</div></div>`:'<div></div>').join('');
  document.getElementById('ano').innerHTML=`
  <div class="bar"><select id="selY">${anos.map(x=>`<option ${x==y?'selected':''} value="${x}">Temporada ${x}</option>`).join('')}</select><span class="sub">${nR} rachas${y===anos[0]&&RESTANTES>0?` · faltam ${RESTANTES}`:''}</span></div>
  <h2>🏆 Corrida pelos prêmios</h2>
  <p class="sub">${ch?`Chance de cada um terminar o ano na frente. Simulei ${n0(4000)} vezes os ${RESTANTES} rachas que faltam, usando a presença e o desempenho de cada jogador nesta temporada.`:'Líder e vantagem sobre o 2º colocado.'}</p>
  <div class="awards">${aw}</div>
  <h2>Pódio</h2>
  <div class="podium">${pod}</div>
  <h2>Ranking geral</h2>
  <p class="sub">Toque no nome para abrir a página do jogador, ou no cabeçalho para reordenar.</p>
  ${tabela([['Jogador','j'],['Var.','vr',varF],['Pontos','pts',v=>`<div class="pb"><i style="width:${50*v/maxP}px"></i><b>${n0(v)}</b></div>`],['Presença','pres',v=>`<div class="mini"><i style="width:${v*100}%"></i></div>${pct(v)}`],['Jogos','J'],['V','V',v=>`<span class="cv">${v}</span>`],['E','E'],['D','D',v=>`<span class="cd">${v}</span>`],['Aproveit.','pv',(v,s)=>`<div class="ved" title="${s.V}V ${s.E}E ${s.D}D"><i style="flex:${s.V};background:var(--win)"></i><i style="flex:${s.E};background:var(--draw)"></i><i style="flex:${s.D};background:var(--loss)"></i></div>${pct(v)}`],['Gols','G'],['Gols/J','gj',heat(L,'gj')],['Assist','A'],['Assist/J','aj',heat(L,'aj')]],L,'pts',{medals:true,cls:'rkg'})}
  <p class="note">Pontos = 3×V + E + gols + assistências + 100×(% de vitórias) + bônus de goleiro.${y>=ANO_REGRA_AVULSO?` Para quem não é fixo, o % de vitórias dos pontos é calculado sobre a média de jogos dos fixos no ano (${n0(REF_J[y])} jogos), ou sobre os próprios jogos se tiver mais.`:''} Presença = rachas em que jogou ÷ rachas do ano.${semED?` Nesta temporada não foram registrados empates e derrotas. Por isso o % de vitórias dos pontos considera ${JOGOS_POR_RACHA} jogos por racha jogado (vitórias ÷ ${JOGOS_POR_RACHA}×rachas), a média real de 2024 em diante. Esses pontos valem como oficiais para os recordes.`:''}</p>
  <h2>🧤 Goleiros</h2>
  ${tabela([['Goleiro','j'],['Pontos','pts',n0,'pts'],['Bônus','B'],['Gols sofridos','GS'],['Média/jogo','mgs',n1],['Jogos no gol','JG'],['Rachas no gol','gkR']],GK,'pts',{medals:true})}
  <p class="note">Pontos do goleiro contam só os rachas em que ele jogou no gol. Bônus por racha (só com mais de 2 jogos no gol): 0 gols sofridos = 10 pts, 1 = 9 … 8 = 2, 9 ou mais = 0.</p>`;
  document.getElementById('selY').onchange=e=>ano(e.target.value);
}
function anoCons(y,L){
  L.forEach(s=>s.T=s.G+s.A);
  document.getElementById('ano').innerHTML=`
  <div class="bar"><select id="selY">${anos.map(x=>`<option ${x==y?'selected':''} value="${x}">Temporada ${x}</option>`).join('')}</select><span class="sub">ano consolidado</span></div>
  <div class="c"><small>Ano consolidado</small>Os dados de ${y} foram lançados só com os totais do ano (vitórias, gols e assistências), sem racha por racha. Por isso não há presença, % de vitórias nem pontuação nesta temporada.</div>

/* ---------- Jogador ---------- */
function jogador(j,y){
  const nomes=[...new Set(R.map(r=>r.j))].sort((a,b)=>a.localeCompare(b));
  j=j||ordem(agg(R.filter(r=>r.y===anos[0])),'pts')[0].j;
  const mine=R.filter(r=>r.j===j),mineN=mine.filter(r=>!CONS.has(r.y)).sort((a,b)=>a.d.localeCompare(b.d));
  const anosJ=[...new Set(mineN.map(r=>r.y))].sort((a,b)=>b-a);
  y=anosJ.includes(+y)?+y:anosJ[0];
  const car=agg(mine)[0],carN=agg(mineN)[0]||{R:0,J:0};
  const tits=TIT.filter(t=>t[2]===j).sort((a,b)=>a[0]-b[0]);
  const nGol=mine.filter(r=>r.p==='GOLEIRO').length,nLin=mine.length-nGol;
  const posTxt=nGol&&nLin?(nGol>nLin?'Goleiro (às vezes na linha)':'Linha (às vezes no gol)'):nGol?'Goleiro':'Linha';
  const rec=(e,t,v,x)=>`<div class="c"><small>${e} ${t}</small><b>${v}</b><span class="x">${x}</span></div>`;

  if(outros.length>3){

    if(CONS.has(a))return Object.assign(s,{ano:a,j:String(a),rk:'consolidado',pres:NaN,pts:NaN,pv:NaN,J:'—',B:'—',gj:NaN,aj:NaN});

  const anosG=porAno.filter(s=>anosED.has(s.ano)).sort((a,b)=>a.ano-b.ano);
  if(anosG.length>1)html+=`<h2>Ano a ano</h2><p class="sub">Gols e assistências por jogo em cada temporada. Toque nas barras para ver o valor.</p>
    <div class="chart">${barras(anosG.map(s=>s.ano),[{nome:'Gols por jogo',cor:css('--s1'),vals:anosG.map(s=>s.gj)},{nome:'Assist. por jogo',cor:css('--s2'),vals:anosG.map(s=>s.aj)}])}</div>`;

  // recordes
  const best=[...mineN].sort((a,b)=>diaPts(b)-diaPts(a)||b.d.localeCompare(a.d))[0];
  const maxG=[...mineN].sort((a,b)=>b.g-a.g||b.d.localeCompare(a.d))[0];

  const minhas=new Set(mineN.map(r=>r.d));let sq=0,sqMax=0,sqIni='',ini='';

  let sg=0,sgMax=0;for(const r of mineN){sg=r.g>0?sg+1:0;sgMax=Math.max(sgMax,sg)}
  const comED=mineN.filter(r=>anosED.has(r.y)),inv=comED.filter(r=>r.dr===0&&r.v+r.e>0).length;
  const mes={};mineN.forEach(r=>{const m=+r.d.slice(5,7)-1;(mes[m]??={n:0,p:0}).n++;mes[m].p+=diaPts(r)});
  const bm=Object.entries(mes).filter(([,v])=>v.n>=3).sort((a,b)=>b[1].p/b[1].n-a[1].p/a[1].n)[0];

  </div>`;
  // parceiros (inferido: mesmo V/E/D no mesmo racha = mesmo time)

  if(P.length){

/* ---------- Comparar ---------- */
function comparar(a,b,per){
  const nomes=[...new Set(R.map(r=>r.j))].sort((x,y)=>x.localeCompare(y));
  const rk=ordem(agg(R.filter(r=>r.y===anos[0])),'pts');
  a=a||rk[0].j;b=b||(rk[1].j===a?rk[0].j:rk[1].j);
  const anosC=anos.filter(y=>!CONS.has(y));
  per=per||String(anosC[0]);
  const noPer=r=>!CONS.has(r.y)&&(per==='car'||r.y===+per);
  const rows=R.filter(noPer),nR=new Set(rows.map(r=>r.d)).size;
  const L=agg(rows);L.forEach(s=>s.pres=s.R/nR);
  const A=L.find(s=>s.j===a),B=L.find(s=>s.j===b);
  const tit=j=>TIT.filter(t=>t[2]===j&&(per==='car'||t[0]===+per)).length;
  const melhor=j=>Math.max(0,...rows.filter(r=>r.j===j).map(diaPts));
  const sel=(id,v)=>`<select id="${id}">${nomes.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  let html=`<div class="cbar">${sel('cA',a)}<b>x</b>${sel('cB',b)}<select id="cP"><option value="car" ${per==='car'?'selected':''}>Carreira</option>${anosC.map(y=>`<option value="${y}" ${per==String(y)?'selected':''}>Temporada ${y}</option>`).join('')}</select></div>`;
  if(!A||!B){document.getElementById('comp').innerHTML=html+`<div class="c">${!A?a:b} não jogou ${per==='car'?'nenhum racha registrado':'em '+per}. Escolha outro período.</div>`;bindC(a,b,per);return}
  if(a===b){document.getElementById('comp').innerHTML=html+'<div class="c">Escolha dois jogadores diferentes.</div>';bindC(a,b,per);return}
  const ed=per==='car'?true:anosED.has(+per);
  const Q=[
    ['Pontos',s=>s.pts,n0,per!=='car'],
    ['Presença',s=>s.pres,pct,per!=='car'],
    ['Rachas',s=>s.R,n0,true],
    ['Jogos',s=>s.J,n0,true],
    ['Vitórias',s=>s.V,n0,true],
    ['% de vitórias',s=>s.pv,pct,ed],
    ['Gols',s=>s.G,n0,true],
    ['Gols por jogo',s=>s.gj,n1,true],
    ['Assistências',s=>s.A,n0,true],
    ['Assist. por jogo',s=>s.aj,n1,true],
    ['Participação em gols',s=>s.ga,n1,true],
    ['Melhor rodada',s=>melhor(s.j),v=>v+' pts',true],
    ['Títulos',s=>tit(s.j),n0,true],
  ].filter(q=>q[3]);
  let wa=0,wb=0;
  const linhasD=Q.map(([t,f,fmt])=>{const va=f(A),vb=f(B),mx=Math.max(va,vb)||1;if(va>vb)wa++;else if(vb>va)wb++;
    return `<div class="dl"><div class="lb">${t}</div><div class="row"><b class="${va>vb?'w':va<vb?'l':''}">${fmt(va)}</b><div class="l1"><i style="width:${100*va/mx}%"></i></div><div class="l2"><i style="width:${100*vb/mx}%"></i></div><b class="${vb>va?'w':vb<va?'l':''}">${fmt(vb)}</b></div></div>`}).join('');
  const nome=per==='car'?'na carreira':'em '+per;
  html+=`<div class="vs"><div><h3>${a}</h3><div class="sc">${wa}</div><p>quesitos vencidos</p></div><div class="x">VS</div><div><h3>${b}</h3><div class="sc">${wb}</div><p>quesitos vencidos</p></div></div>
  <h2>Quesito a quesito</h2><p class="sub">${nome[0].toUpperCase()+nome.slice(1)}${per==='car'?`, sem o ano consolidado. % de vitórias e médias por jogo contam só de ${Math.min(...anosED)} em diante, porque antes não havia empates e derrotas registrados`:''}. ✓ marca quem leva em cada quesito.</p>
  <div class="lg"><span><i style="background:var(--s1)"></i>${a}</span><span><i style="background:var(--s2)"></i>${b}</span></div>
  <div class="duel">${linhasD}</div>`;
  // juntos x contra (inferido pelo mesmo V/E/D no dia)
  const rA={},rB={};rows.filter(r=>anosED.has(r.y)).forEach(r=>{if(r.j===a)rA[r.d]=r;if(r.j===b)rB[r.d]=r});
  const ambos=Object.keys(rA).filter(d=>rB[d]);
  if(ambos.length){
    const cnt={};rows.forEach(r=>{const k=r.d+'|'+r.v+'|'+r.e+'|'+r.dr;cnt[k]=(cnt[k]||0)+1});
    const mesmo=d=>{const x=rA[d],y=rB[d];return x.v===y.v&&x.e===y.e&&x.dr===y.dr&&cnt[d+'|'+x.v+'|'+x.e+'|'+x.dr]<=6};
    const jun=ambos.filter(mesmo),sep=ambos.filter(d=>!mesmo(d));
    const vj=jun.reduce((s,d)=>s+rA[d].v,0),jj=jun.reduce((s,d)=>s+rA[d].v+rA[d].e+rA[d].dr,0);
    let ga=0,gb=0,em=0;sep.forEach(d=>{const x=diaPts(rA[d]),y=diaPts(rB[d]);x>y?ga++:y>x?gb++:em++});
    html+=`<h2>🤝 Juntos e separados</h2><p class="sub">Estimativa pelos resultados do dia: quem terminou com o mesmo V/E/D foi considerado do mesmo time. ${per==='car'?`Desde ${Math.min(...anosED)}.`:''}</p>
    <div class="cards">
     <div class="c"><small>No mesmo time</small><b>${jun.length} racha${jun.length===1?'':'s'}</b><span class="x">${jj?pct(vj/jj)+' de vitórias juntos':''}</span></div>
     <div class="c"><small>Em times diferentes</small><b>${sep.length} racha${sep.length===1?'':'s'}</b><span class="x">quem fez mais pontos no dia</span></div>
     ${sep.length?`<div class="c"><small>Duelo direto</small><b>${ga} x ${gb}</b><span class="x">${a} x ${b}${em?` · ${em} empate${em>1?'s':''}`:''}</span></div>`:''}
    </div>`;
  }
  // evolução (temporada) ou ano a ano (carreira)
  if(per!=='car'){
    const datY=[...new Set(rows.map(r=>r.d))].sort();
    const acc=n=>{let s=0;return datY.map(d=>{for(const r of rows)if(r.d===d&&r.j===n)s+=diaPts(r);return s})};
    if(datY.length>1)html+=`<h2>Evolução em ${per}</h2><p class="sub">Pontos acumulados rodada a rodada (3×V + E + gols + assistências).</p>
    <div class="chart">${linhas([{nome:a,cor:css('--s1'),vals:acc(a)},{nome:b,cor:css('--s2'),vals:acc(b),dash:true}],datY.map(d=>fd(d).slice(0,5)))}</div>`;
  }else{
    const ys=anosC.filter(y=>R.some(r=>r.y===y&&(r.j===a||r.j===b))).sort((x,y)=>x-y),ysE=ys.filter(y=>anosED.has(y));
    const st=(j,y)=>agg(R.filter(r=>r.y===y&&r.j===j))[0];
    if(ysE.length>1)html+=`<h2>Gols por jogo, ano a ano</h2><p class="sub">Toque nas barras para ver o valor.</p>
    <div class="chart">${barras(ysE,[{nome:a,cor:css('--s1'),vals:ysE.map(y=>st(a,y)?.gj??NaN)},{nome:b,cor:css('--s2'),vals:ysE.map(y=>st(b,y)?.gj??NaN)}])}</div>`;
    const lin=ys.map(y=>{const rows=R.filter(r=>r.y===y),Lr=ordem(agg(rows),'pts'),pa=Lr.findIndex(s=>s.j===a)+1,pb=Lr.findIndex(s=>s.j===b)+1;
      const x=st(a,y),z=st(b,y);return {j:String(y),ord:y,ra:pa?pa+'º':'—',pa:x?.pts,ga:x?.G,rb:pb?pb+'º':'—',pb:z?.pts,gb:z?.G}});
    html+=`<h2>Ano a ano</h2><p class="sub">Posição no ranking e pontos de cada um.${anosED.size?` Antes de ${Math.min(...anosED)} a pontuação sai inflada.`:''}</p>${tabela([['Ano','j'],[a+' pos.','ra',v=>v],[a+' pts','pa',n0],[a+' gols','ga',v=>v??'—'],[b+' pos.','rb',v=>v],[b+' pts','pb',n0],[b+' gols','gb',v=>v??'—']],lin,'ord',{plain:true})}`;
  }
  document.getElementById('comp').innerHTML=html;bindC(a,b,per);
}
function bindC(a,b,per){
  document.getElementById('cA').onchange=e=>comparar(e.target.value,b,per);
  document.getElementById('cB').onchange=e=>comparar(a,e.target.value,per);
  document.getElementById('cP').onchange=e=>comparar(a,b,e.target.value);
}


/* ---------- estatísticas: um bloco por número ---------- */
const STATS=[
  {k:'pts',nome:'Pontos',e:'⭐',suf:'pts',cons:false},
  {k:'G',nome:'Gols',e:'⚽',suf:'gols',cons:true,pj:'gj'},
  {k:'A',nome:'Assistências',e:'🎯',suf:'assist.',cons:true,pj:'aj'},
  {k:'V',nome:'Vitórias',e:'💪',suf:'vitórias',cons:true,pj:'pv'},
  {k:'R',nome:'Presença',e:'📅',suf:'rachas',cons:false},
  {k:'gkR',nome:'Goleiros',e:'🧤',suf:'rachas no gol',cons:false,gk:true}];
function estat(k){
  const st=STATS.find(x=>x.k===k);
  const ys=anos.filter(y=>st.cons||!CONS.has(y));
  // por temporada
  const porAno=ys.map(y=>{const rows=R.filter(r=>r.y===y);let L=st.gk?agg(rows.filter(r=>r.p==='GOLEIRO'),true):agg(rows);
    L=L.filter(s=>s[k]>0);return {y,L:ordem(L,k)}}).filter(o=>o.L.length);
  // carreira: soma das temporadas (pontos e presença) ou total direto
  const car={};porAno.forEach(({y,L})=>L.forEach(s=>{const c=car[s.j]??={j:s.j,tot:0,anos:0,mel:-1,melY:0,JE:0,num:0,GS:0,JG:0};
    c.tot+=s[k];c.anos++;if(s[k]>c.mel){c.mel=s[k];c.melY=y}
    if(anosED.has(y)){c.JE+=s.JE;c.num+=st.k==='G'?s.GE:st.k==='A'?s.AE:s.VE}
    if(st.gk&&anosED.has(y)){c.GS+=s.GS;c.JG+=s.JG}}));
  const C=Object.values(car);C.forEach(c=>{c.pj=c.JE>=30?c.num/c.JE:NaN;c.mgs=c.JG>=30?c.GS/c.JG:NaN});
  const CT=ordem(C,'tot');
  let rec=null;porAno.forEach(({y,L})=>{if(!rec||L[0][k]>rec.v)rec={j:L[0].j,v:L[0][k],y}});
  const aj=y=>CONS.has(y)?' (só totais)':!anosED.has(y)&&k==='pts'?' *':y===anos[0]&&RESTANTES>0?' (em andamento)':'';
  const fmt=v=>k==='V'&&false?v:n0(v);
  const card=(t,j,v,x)=>`<div class="c"><small>${t}</small><b><a class="pl" data-j="${j}">${j}</a></b><span class="x">${v}${x?' · '+x:''}</span></div>`;
  let cards=card('🏅 Recorde numa temporada',rec.j,`${fmt(rec.v)} ${st.suf}`,`${rec.y}${aj(rec.y)}`)+card('📚 Líder histórico',CT[0].j,`${fmt(CT[0].tot)} ${st.suf}`,`em ${CT[0].anos} temporada${CT[0].anos>1?'s':''}`);
  if(st.pj){const b=ordem(C.filter(c=>isFinite(c.pj)),'pj')[0];if(b)cards+=card(k==='V'?'📈 Melhor aproveitamento':'📈 Melhor média por jogo',b.j,k==='V'?pct(b.pj):n1(b.pj)+' por jogo',`desde ${Math.min(...anosED)}, mín. 30 jogos`)}
  if(st.gk){const b=[...C.filter(c=>isFinite(c.mgs))].sort((a,b)=>a.mgs-b.mgs)[0];if(b)cards+=card('🧱 Menos gols sofridos por jogo',b.j,n1(b.mgs)+' por jogo',`desde ${Math.min(...anosED)}, mín. 30 jogos no gol`)}
  const cols=[['Jogador','j'],['Total','tot',n0,'pts'],['Temporadas','anos'],['Melhor ano','mel',(v,c)=>`${n0(v)} <small style="color:var(--muted)">(${c.melY})</small>`]];
  if(st.pj)cols.push([k==='V'?'Aproveit.':'Por jogo','pj',v=>isFinite(v)?(k==='V'?pct(v):n1(v)):'—']);
  if(st.gk)cols.push(['Sofridos*','GS'],['Sofridos/jogo','mgs',v=>isFinite(v)?n1(v):'—']);
  const lider=porAno.slice().map(({y,L})=>({j:y+aj(y),ano:y,l:L[0].j,v:L[0][k],s:L[1]?L[1].j:'—',sv:L[1]?L[1][k]:NaN}));
  document.getElementById('stats').innerHTML=`
  <div class="chips">${STATS.map(x=>`<button data-k="${x.k}" class="${x.k===k?'on':''}">${x.e} ${x.nome}</button>`).join('')}</div>
  <h2>${st.e} ${st.nome}</h2>
  <div class="cards">${cards}</div>
  <h2>Ranking histórico</h2><p class="sub">Soma de todas as temporadas${st.cons?'':`, sem ${[...CONS].join(', ')}`}. Toque no cabeçalho para reordenar.</p>
  ${tabela(cols,CT.slice(0,20),'tot',{medals:true})}
  <h2>Líder de cada ano</h2>
  ${tabela([['Ano','j'],['Líder','l'],[st.suf[0].toUpperCase()+st.suf.slice(1),'v',n0,'pts'],['2º lugar','s'],['2º','sv',n0]],lider,'ano',{plain:true})}
  <p class="note">${[
    st.cons&&CONS.size?`${[...CONS].join(', ')} entra só com os totais do ano, sem racha por racha.`:CONS.size?`${[...CONS].join(', ')} fica de fora porque só tem os totais do ano.`:'',
    k==='pts'?`* Em ${anos.filter(y=>!anosED.has(y)&&!CONS.has(y)).sort().join(' e ')} não foram registrados empates e derrotas, então o % de vitórias dos pontos considera ${JOGOS_POR_RACHA} jogos por racha jogado.`:'',
    st.pj?`Médias por jogo só contam de ${Math.min(...anosED)} em diante, quando empates e derrotas passaram a ser registrados.`:'',
    st.gk?`Conta só os rachas em que o jogador atuou no gol. * Gols sofridos e média por jogo contam de ${Math.min(...anosED)} em diante, porque antes os jogos de cada goleiro não eram registrados por completo.`:''].filter(Boolean).join(' ')}</p>`;
  document.querySelector('#stats .chips').onclick=e=>{const b=e.target.closest('button');if(b)estat(b.dataset.k)};
}

function recordes(){
  const ys=anos.filter(y=>!CONS.has(y)),top={};
  const por=ys.map(y=>{const L=agg(R.filter(r=>r.y===y));const a=ordem(L,'pts')[0],g=ordem(L,'G')[0],as=ordem(L,'A')[0];
    [['pts',a],['G',g],['A',as]].forEach(([k,s])=>{if(!top[k]||s[k]>top[k].v)top[k]={j:s.j,v:s[k],y}});return {y,a,g}});
  const aj=y=>!anosED.has(y)?' *':y===anos[0]&&RESTANTES>0?' (em andamento)':'';
  const card=(e,t,r,suf)=>`<div class="c"><small>${e} ${t}</small><b><a class="pl" data-j="${r.j}">${r.j}</a></b><span class="x">${n0(r.v)} ${suf} em ${r.y}${aj(r.y)}</span></div>`;
  return `<h2>📈 Recordes de temporada</h2><p class="sub">O maior número de cada jogador num único ano.</p>
  <div class="cards">${card('⭐','Mais pontos',top.pts,'pts')}${card('⚽','Mais gols',top.G,'gols')}${card('🎯','Mais assistências',top.A,'assist.')}</div>
  <div style="height:10px"></div>
  ${tabela([['Ano','j'],['Mais pontos','mp'],['Pontos','pts',n0,'pts'],['Artilheiro','ag'],['Gols','G']],por.map(o=>({j:o.y+aj(o.y),ano:o.y,mp:o.a.j,pts:o.a.pts,ag:o.g.j,G:o.g.G})),'ano',{plain:true})}
  <p class="note">* Em ${ys.filter(y=>!anosED.has(y)).join(' e ')} não foram registrados empates e derrotas. Os pontos desses anos consideram ${JOGOS_POR_RACHA} jogos por racha jogado para o % de vitórias, a média real de 2024 em diante, e valem como oficiais. ${[...CONS].join(', ')} fica de fora porque só tem os totais do ano.</p>`;
}

function titulos(){
  const T={'MELHOR JOGADOR':'mj','ARTILHEIRO':'art','ASSISTENTE':'ass','VITORIOSO':'vit','MELHOR GOLEIRO':'gol'};
  const P=Object.fromEntries(PREMIOS.map(p=>[p.id,p]));
  const cnt={};TIT.forEach(([y,t,j])=>{const c=cnt[j]??={j,T:0,by:{},anos:new Set()};c.T++;c.by[T[t]]=(c.by[T[t]]||0)+1;c.anos.add(y)});
  const L=Object.values(cnt).sort((a,b)=>b.T-a.T||(b.by.mj||0)-(a.by.mj||0)||a.j.localeCompare(b.j));
  const ys=[...new Set(TIT.map(t=>t[0]))].sort((a,b)=>b-a);
  const porAno={};TIT.forEach(([y,t,j])=>(porAno[y]??={})[T[t]]=j);
  // temporada mais dominante: mais prêmios num mesmo ano
  const dom=[];ys.forEach(y=>{const c={};TIT.filter(t=>t[0]===y).forEach(t=>c[t[2]]=(c[t[2]]||0)+1);Object.entries(c).forEach(([j,n])=>dom.push({j,y,n}))});
  const dm=dom.sort((a,b)=>b.n-a.n||b.y-a.y)[0];
  const maxMJ=[...L].sort((a,b)=>(b.by.mj||0)-(a.by.mj||0))[0];
  const mini=(id,n)=>`<span class="tt" style="background:${P[id].cor}22;color:${P[id].cor}" data-tip="${P[id].nome}: ${n}">${TROFEU(P[id].cor)}<b>${n}</b></span>`;
  // temporada atual em disputa
  const yA=anos[0],emAberto=!porAno[yA]&&!CONS.has(yA);
  let aberto='';
  if(emAberto){const rows=R.filter(r=>r.y===yA),La=agg(rows),GK=agg(rows.filter(r=>r.p==='GOLEIRO'),true);
    aberto=`<div class="yr open"><div class="yh"><b>${yA}</b><span>em disputa · líderes hoje</span></div>${PREMIOS.map(p=>{const l=topo(p.gk?GK:La,p.k);return l?`<div class="yl">${icone(p)}<div><small>${p.nome}</small><b>${l.j}</b></div></div>`:''}).join('')}</div>`}
  document.getElementById('titulos').innerHTML=`
  <div class="cards">
   <div class="c"><small>👑 Maior campeão</small><b>${L[0].j}</b><span class="x">${L[0].T} títulos</span></div>
   <div class="c"><small>⭐ Mais vezes melhor jogador</small><b>${maxMJ.j}</b><span class="x">${maxMJ.by.mj} vezes</span></div>
   ${dm?`<div class="c"><small>🔥 Temporada mais dominante</small><b>${dm.j}</b><span class="x">${dm.n} prêmios em ${dm.y}</span></div>`:''}
   <div class="c"><small>🏆 Campeões diferentes</small><b>${L.length}</b><span class="x">em ${ys.length} temporadas</span></div>
  </div>
  ${recordes()}
  <h2>🏛️ Galeria da fama</h2><p class="sub">Todos os premiados, com os troféus de cada um.</p>
  <div class="fame">${L.map((c,i)=>`<div class="fm${i<3?' f'+i:''}"><div class="fr"><span class="rk">${medal(i)}</span><div><b><a class="pl" data-j="${c.j}">${c.j}</a></b><small>${[...c.anos].sort().join(' · ')}</small></div><em>${c.T}</em></div>
    <div class="tts">${PREMIOS.filter(p=>c.by[p.id]).map(p=>mini(p.id,c.by[p.id])).join('')}</div></div>`).join('')}</div>
  <div class="lg" style="margin-top:10px">${PREMIOS.map(p=>`<span><i style="background:${p.cor}"></i>${p.nome}</span>`).join('')}</div>
  <h2>📜 Campeões por ano</h2>
  <div class="years">${aberto}${ys.map(y=>`<div class="yr"><div class="yh"><b>${y}</b></div>${PREMIOS.map(p=>{const j=porAno[y][p.id];return `<div class="yl">${icone(p)}<div><small>${p.nome}</small><b>${j?`<a class="pl" data-j="${j}">${j}</a>`:'—'}</b></div></div>`}).join('')}</div>`).join('')}</div>`;
}

function coletes(){
  const m={};COL.forEach(([d,j])=>{(m[j]??={j,ds:[]}).ds.push(d)});
  const L=Object.values(m);L.forEach(s=>{s.ds.sort();s.ult=s.ds[s.ds.length-1]});
  // regra: menor taxa = lavagens ÷ rachas desde a entrada no rodízio (1º racha jogado desde o início do rodízio); empate = quem lavou há mais tempo
  const ini=COL.map(c=>c[0]).sort()[0];
  // taxa = lavagens ÷ rachas que a pessoa jogou desde o início do rodízio; ativo = jogou algum dos últimos 4 rachas
  const ult4=datas.slice(-4);
  L.forEach(s=>{const jog=new Set(R.filter(r=>r.j===s.j&&r.d>=ini).map(r=>r.d));s.nR=Math.max(1,jog.size);s.tx=s.ds.length/s.nR;s.ativo=ult4.some(d=>jog.has(d))});
  // nota = 70% pelo nº de lavagens + 30% pela frequência (cada parte dividida pelo maior valor do grupo); menor nota lava primeiro
  const PESO_VEZES=0.7,mxV=Math.max(...L.map(s=>s.ds.length)),mxT=Math.max(...L.map(s=>s.tx));
  L.forEach(s=>s.nota=PESO_VEZES*s.ds.length/mxV+(1-PESO_VEZES)*s.tx/mxT);
  const ordemF=(x,y)=>x.nota-y.nota||x.ult.localeCompare(y.ult);
  // trava: quem lavou num dos últimos 4 rachas vai para o fim da fila, do que lavou há mais tempo para o mais recente
  L.forEach(s=>s.trava=s.ult>=ult4[0]);
  const ordemT=(x,y)=>(x.trava-y.trava)||(x.trava?x.ult.localeCompare(y.ult):ordemF(x,y));
  const fila=L.filter(s=>s.ativo).sort(ordemT),fora=L.filter(s=>!s.ativo).sort(ordemF);
  const hist=[...COL].sort((a,b)=>b[0].localeCompare(a[0]));
  const prox=fila[0],last=hist[0];
  document.getElementById('coletes').innerHTML=`
  <div class="hero" style="text-align:center"><p style="margin:0">🧺 Próximo a lavar os coletes</p><h3 style="font-size:34px;margin:4px 0">${prox?prox.j:'—'}</h3>
  <p style="margin:0">${prox?`lavou ${prox.ds.length}x · última em ${fd(prox.ult)}`:''}</p></div>
  <div class="cards" style="margin-top:10px">${fila.slice(1,3).map((s,i)=>`<div class="c" style="text-align:center"><small>${i+2}º da fila</small><b>${s.j}</b><span class="x">${s.ds.length}x · última ${fd(s.ult)}</span></div>`).join('')}</div>
  <div class="c" style="margin-top:10px;text-align:center"><small>Última lavagem</small><b>${last?last[1]:'—'}</b><span class="x">${last?fd(last[0]):''}</span></div>
  <h2>Fila</h2><p class="sub">A ordem sai de uma nota: 70% pelo número de vezes que a pessoa já lavou e 30% pela frequência com que lava (vezes ÷ rachas jogados desde ${fd(ini)}). Menor nota lava primeiro, mas quem lavou num dos últimos 4 rachas vai para o fim da fila, e no empate vai na frente quem lavou há mais tempo. Só entra na fila quem jogou pelo menos um dos últimos 4 rachas. Se o próximo não estiver no racha, passa para o seguinte.</p>
  <div class="tw"><table><thead><tr><th class="pos">#</th><th>Nome</th><th>Vezes</th><th>Rachas jogados</th><th>1 a cada</th><th>Última vez</th></tr></thead><tbody>
  ${fila.map((s,i)=>`<tr${i<3?' style="background:var(--soft);font-weight:'+(i===0?700:600)+'"':''}><td class="pos">${i+1}</td><td>${s.j}</td><td>${s.ds.length}</td><td>${s.nR}</td><td>${(s.nR/s.ds.length).toFixed(1).replace('.',',')} rachas</td><td>${fd(s.ult)}</td></tr>`).join('')}
  </tbody></table></div>
  ${fora.length?`<p class="note">Fora da fila por enquanto (não jogaram nenhum dos últimos 4 rachas): ${fora.map(s=>`${s.j} (${s.ds.length}x)`).join(', ')}. Eles voltam automaticamente quando jogarem de novo, com o histórico mantido.</p>`:''}
  <details style="margin-top:16px"><summary class="sub" style="cursor:pointer">Ver histórico completo</summary><div style="height:8px"></div>
  ${[...new Set(hist.map(h=>h[0].slice(0,4)))].map(y=>`<div class="hist"><h3>${y}</h3>${hist.filter(h=>h[0].startsWith(y)).map(h=>`<div><span>${fd(h[0]).slice(0,5)}</span>${h[1]}</div>`).join('')}</div>`).join('')}</details>`;
}


const nRAt=new Set(R.filter(r=>r.y===anos[0]).map(r=>r.d)).size;
document.getElementById('atual').textContent=`Atualizado até a rodada de ${fd(ult)} · ${nRAt} rachas em ${anos[0]}`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['ano','semana','jogador','comp','stats','titulos','coletes'].forEach(id=>document.getElementById(id).classList.toggle('hide',id!==b.dataset.t));scrollTo(0,0)});
document.addEventListener('click',e=>{const a=e.target.closest('a.pl');if(!a)return;jogador(a.dataset.j);document.querySelector('nav button[data-t=jogador]').click()});
ano(anos[0]);semana(ult);jogador('');comparar();estat('G');titulos();coletes();
</script>
</body>
</html>
